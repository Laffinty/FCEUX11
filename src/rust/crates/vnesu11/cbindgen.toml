# vNESU11 cbindgen config (Phase 0 §1.1).
#
# Mirrors the pattern used by fceux11-lua and the other member crates
# (see src/rust/cbindgen.toml and src/rust/build.rs). The generated
# header lands in `src/rust/crates/vnesu11/target/vnesu11_ffi.h` for
# Phase 0 local verification; Phase 6 will fold it into the merged
# fceux11_rust.h like the other crates.

language = "C"
cpp_compat = false
include_version = true
header = "/* Auto-generated by cbindgen. Do not edit. */"

[parse]
parse_deps = false

[export]
prefix = ""
# Phase 0: export everything (lifecycle, mapper handlers, peek/poke,
# savestate stubs). Phase 6+ will tighten this as the surface stabilizes.
include = [
    "CpuRegsLayout",
    "ReadRangeHandler",
    "WriteRangeHandler",
    "MapperMetaVtable",
]
item_types = []
