[package]
name = "f11qa"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[[bin]]
name = "f11qa-runner"
path = "src/main.rs"

# F11QA v1.8 §5 — 统一 ROM runner dispatcher (kgmqa-048~112 + blargg 系列路由)
# Phase 5 framework; Phase 9 实战时每个 suite 适配 $6000 / 屏幕 hash / log diff 等协议
[[bin]]
name = "f11qa-rom-runner"
path = "src/bin/rom_runner.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Track C Task 1 / C-2: CRC32 matches C++ CalcCRC32 (delegates to
# fceux11_rust_crc32 → crc32fast::Hasher). Adding the crate directly so
# unit tests can reference it for parity checks.
crc32fast = "1.4"
# Track C Task 1 / C-3: MD5 matches C++ md5 (delegates to
# fceux11_rust_md5_* in src/utils/md5.cpp). Using the RustCrypto
# crate as a reference implementation for unit-test parity checks.
md-5 = "0.10"
digest = "0.10"

[features]
# P5: Enable the in-process (direct) adapter via C ABI FFI.
# Requires linking against fceux11_core + fceux11_drivers_null.
# Only available when built through CMake (kagami_qa_direct_runner target).
direct-adapter = []

[dev-dependencies]
tempfile = "3"
