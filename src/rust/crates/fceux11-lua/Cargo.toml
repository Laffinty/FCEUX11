[package]
name = "fceux11-lua"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[features]
ffi-tests = []

[dependencies]
fceux11-utils = { path = "../fceux11-utils" }
mlua = { version = "0.10", features = ["lua51", "vendored"] }

[dev-dependencies]
mlua = { version = "0.10", features = ["lua51", "vendored"] }

# Unit tests for this crate require linking against the C++ fceux11_rust library.
# Pure Rust tests (keys_for, etc.) always work. FFI-dependent tests need the
# `ffi-tests` feature, which is only available during CMake integration builds.
# Run `cargo test --workspace --exclude fceux11-lua` for pure Rust tests.