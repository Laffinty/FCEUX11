[package]
name = "fceux11-core"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
fceux11-formats = { path = "../fceux11-formats" }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
crc32fast = "1.4"
bitflags = "2.13"
memoffset = "0.9"

[dev-dependencies]
# Phase 2: proptest for property-based fuzz over reset-state vectors.
proptest = "1.4"
# Phase 4 sub-step 6: criterion for the step() / tick() microbench.
criterion = { version = "0.5", default-features = false }

[features]
default = []

[[bench]]
name = "step_bench"
harness = false
