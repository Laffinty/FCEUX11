[workspace]
members = [".", "crates/*", "tests/*"]
resolver = "3"

[workspace.package]
version = "0.3.5"
edition = "2024"

[profile.release]
panic = "abort"
lto = true

[package]
name = "fceux11-rust"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]
name = "fceux11_rust"

[dependencies]
fceux11-utils = { path = "crates/fceux11-utils" }
fceux11-media = { path = "crates/fceux11-media" }
fceux11-formats = { path = "crates/fceux11-formats" }
fceux11-debug = { path = "crates/fceux11-debug" }
fceux11-lua = { path = "crates/fceux11-lua" }
fceux11-core = { path = "crates/fceux11-core" }
f11qa = { path = "crates/f11qa" }
# v2.0 S0: GBAEUX11. `optional` so a NES-only build (--features without
# `gba`) physically drops the GBA core from the graph -- plan invariant 8.
#
# NOTE: the vendored core is depended on DIRECTLY rather than through an
# f11gba facade crate. rustc 1.96 fat LTO fails to load the bitcode of a
# tiny rlib sitting between the root and a large path dependency -- it
# reports `failed to load bitcode of module f11gba-...-cgu.0.rcgu.o` with an
# empty diagnostic, and reproduces with f11gba holding nothing but one
# trivial extern "C" function and no gba-core dependency at all. Depending on
# gba-core directly and keeping the C ABI in this root file avoids it and
# matches the shape kagami_qa_direct_main already uses. See plan section 14.
gba-core = { path = "crates/gba-core", optional = true }

[features]
# Stage-2 §七 (C-1): Pass-through to f11qa's `direct-adapter` feature.
# When enabled, f11qa compiles the `direct.rs` FFI adapter and the
# `f11qa_direct_main` symbol. Reusing the root crate's existing
# staticlib (fceux11_rust.lib) avoids producing a separate `f11qa.lib`
# and the LNK2005 std-symbol duplication that would result from linking
# two Rust staticlibs in the same executable.
#
# Always on in CMake builds (see src/rust/CMakeLists.txt) — dead-code
# elimination keeps the unused FFI paths free at runtime.
direct-adapter = ["f11qa/direct-adapter"]

# v2.0 GBAEUX11. Present by default so S0 can assert the
# "fceux11_rust.lib contains the new symbol" exit criterion; a NES-only
# build turns it off with --no-default-features.
gba = ["dep:gba-core"]
default = ["direct-adapter", "gba"]

[dev-dependencies]
# Enable FFI stubs only during Rust workspace tests so cargo test can link
# without the full C++ executable. This feature is never active in the CMake
# Release build, avoiding duplicate symbols with lua-engine.cpp.
fceux11-lua = { path = "crates/fceux11-lua", features = ["ffi-stubs"] }

[build-dependencies]
cbindgen = "0.29.3"
