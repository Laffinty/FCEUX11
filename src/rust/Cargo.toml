[workspace]
members = [".", "crates/*", "tests/*"]
resolver = "3"

[workspace.package]
version = "0.3.5"
edition = "2024"

[profile.release]
panic = "abort"
lto = true

[package]
name = "fceux11-rust"
version.workspace = true
edition.workspace = true

[lib]
crate-type = ["staticlib"]
name = "fceux11_rust"

[dependencies]
fceux11-utils = { path = "crates/fceux11-utils" }
fceux11-media = { path = "crates/fceux11-media" }
fceux11-formats = { path = "crates/fceux11-formats" }
fceux11-debug = { path = "crates/fceux11-debug" }
fceux11-lua = { path = "crates/fceux11-lua" }
fceux11-core = { path = "crates/fceux11-core" }
kagami-qa = { path = "crates/kagami-qa" }
# vnesu11 is intentionally NOT a dep here — it ships as its own staticlib
# (vnesu11.lib) and is linked separately by CMake when VNESU11_CORE=ON.
# Adding it here would duplicate symbols. See docs/wip_2.0_plan/02_architecture.md §7.

[features]
# Stage-2 §七 (C-1): Pass-through to kagami-qa's `direct-adapter` feature.
# When enabled, kagami-qa compiles the `direct.rs` FFI adapter and the
# `kagami_qa_direct_main` symbol. Reusing the root crate's existing
# staticlib (fceux11_rust.lib) avoids producing a separate `kagami_qa.lib`
# and the LNK2005 std-symbol duplication that would result from linking
# two Rust staticlibs in the same executable.
#
# Always on in CMake builds (see src/rust/CMakeLists.txt) — dead-code
# elimination keeps the unused FFI paths free at runtime.
direct-adapter = ["kagami-qa/direct-adapter"]

[dev-dependencies]
# Enable FFI stubs only during Rust workspace tests so cargo test can link
# without the full C++ executable. This feature is never active in the CMake
# Release build, avoiding duplicate symbols with lua-engine.cpp.
fceux11-lua = { path = "crates/fceux11-lua", features = ["ffi-stubs"] }

[build-dependencies]
cbindgen = "0.29.3"
