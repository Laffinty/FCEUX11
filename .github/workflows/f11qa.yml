# FCEUX11 v1.8 F11QA — CI Workflow
#
# Runs the v1.8 QA pipeline on every push to wip1.8 / wip2.0 / wip203 / main.
# Produces a migration matrix artifact, accuracy table, and baseline drift report.
#
# wip2.0 (2026-09-28): added so the GBAEUX11 line is verified on its own branch
# before it merges. It carries a 22K-line vendored core (crates/gba-core) and new
# build glue (src/gba/, the swi_hook seam in gba-core).
#
# wip203 (2026-11-09): added so the v2.0.3 GBA cartridge-compatibility line is
# verified on its own branch, same reason as wip2.0 above.
#
# What this workflow actually checks for the GBA work -- and what it does not
# (corrected 2026-09-30, see plan r17; the previous text here claimed the
# jsmolka suite covered it, and there is no jsmolka step in this file):
#   * YES: it compiles. `gba` is in Cargo.toml's `default` features, so the
#     CMake-driven staticlib build compiles the vendored core and src/gba/ on a
#     clean machine.
#   * YES (v2.0.9): the Rust lock tests run here too. The two "Rust crate
#     lock tests" steps at the end of this job execute `cargo test` over the
#     whole workspace (10 crates, ~1197 tests), so the GBA SWI suite, the
#     vendored core's timing tests and the root crate's fixture locks are no
#     longer local-only.
#   * NO: no jsmolka, no GBA accuracy matrix. The v1.8 NES gates below
#     (ctest, blargg, the migration matrix, the R4 gate) test NES only.
#
# Consequence: a GBA correctness claim is still backed solely by the
# project's own tests plus whatever external reading went into the plan. That
# gap is what the S1b-c / S1d-a reversals (r12, r13, r17) kept falling into.
# The first true external GBA signal is jsmolka `memory.gba`, scheduled for S2.
#
# v2.0.9 -- CI consolidation. This workflow used to be one of two, and both
# configured CMake, built the whole tree (57 test executables, Release with
# whole-program optimisation) and ran the same `ctest -LE perf`. The other
# one (`.github/workflows/ci.yml`) has been removed and its unique checks
# moved in here:
#   * license header check (scripts/license_headers/check.py)
#   * blargg ROM cache
#   * golden savestate drift check / golden layout compare (PR only)
#   * bus dispatch / hot-path alias / board-file drift checks (PR only)
#   * ROM regression test, benchmark smoke, bench tolerance gate
# and the ctest step was replaced by the strict version: the old one here
# carried `continue-on-error: true`, which swallowed every ctest failure.
# Two builds per push became one.
#
# NOTE for the repository owner: the required-check name changes from
# "CI / build-windows" to "F11QA / f11qa". If branch protection lists the old
# name, PRs will block forever until the required check is renamed in the
# repository settings.
#
# v1.8 changes (commit WIP, Phase 7 R4 gate upgrade):
#   * Trigger branches: wip_1.16 → wip1.8
#   * name: KagamiQA → F11QA
#   * job id: kagami-qa → f11qa
#   * Cargo package: kagami-qa → f11qa (Phase 1 retrofix; 同步 Cargo.toml rename)
#   * Binary: kagami-qa-runner.exe → f11qa-runner.exe
#   * ROM fetch: download_blargg_roms.ps1 → fetch_roms_from_mirror.py
#     (single fetch 取代 22 个 downloader, v1.8 §四 §4.6 接入协议)
#   * Pre-flight: kgmqa-117 mirror_snapshot_check 必跑 (早于所有 rom-suite 用例)
#   * R4 gate: total==120 strict (取代 v1.17 的 total>=39), vendor_state 通道校验
#   * Artifact names: kagamiqa_* → f11qa_*

name: F11QA

on:
  # v2.0.9: the branch list is narrowed to `main` because the other four are
  # gone from the remote (`git ls-remote --heads origin` returns only
  # refs/heads/main -- wip2.0 and wip203 were merged and deleted in
  # 2026-11). They were dead weight: a trigger on a branch that no longer
  # exists never fires.
  #
  # v2.0.9 also consolidated the separate `CI` workflow into this one (see
  # the "CI consolidation" note at the top of this file) -- the two
  # workflows were building the same tree twice per run.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:  # allow manual trigger

jobs:
  f11qa:
    runs-on: windows-2022
    # R4-0 (2026-07-31): raised 45 -> 180. Run 82956632293 was killed by the
    # 45-minute cap while still inside the CMake configure step, building
    # Qt 6.8.0 from source ("Installing 30/33 qtbase[...]"), so build / ctest /
    # Hardware Consistency Check / migration matrix never ran. This is an upper bound, not a
    # reservation: once the vcpkg cache below is primed, the configure step
    # skips vcpkg entirely (see CMakeLists.txt:7) and a full run takes ~15 min.
    # The 180 covers the ONE cold priming run.
    timeout-minutes: 180

    env:
      # R4-0: the previous revision cached `${{ env.LOCALAPPDATA }}\vcpkg\archives`,
      # but the workflow-level `env` context does not carry runner environment
      # variables — it expanded to an empty string, so the cache input was the
      # literal `\vcpkg\archives` and vcpkg's binary cache was never preserved.
      # Point it at a deterministic in-workspace directory instead.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_bincache

      # v2.0.4 r17 (2026-11-15): Rust 工具链**锁定**到具体版本。
      #
      # 之前这里是 `stable`（每次自动跟最新）。2026-11-14 stable 从 1.99.1
      # 跳到 1.100.0，而 1.100 的 std 改用 WaitOnAddress / WakeByAddress*
      # 做线程挂起 ⇒ fceux11_rust.lib 里多出三个 __imp_* 未定义符号 ⇒
      # 本仓链接行缺 synchronization.lib ⇒ 5 个 F11QA runner 可执行文件
      # 全部 LNK1120 ⇒ 构建中断、迁移矩阵没产出 ⇒ R4 gate 判红。
      # **本仓代码零改动**，纯粹是工具链漂移打穿了链接契约。
      #
      # 锁定后，工具链升级变成「显式决定」而不是「被外部悄悄改掉」。
      # 升级步骤（先看 native-static-libs 清单，再改版本号）：
      #   见 src/rust/CMakeLists.txt 顶部的契约注释。
      RUST_TOOLCHAIN: '1.100.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # Environment setup
      # -----------------------------------------------------------------------
      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Setup CMake 4.0
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.0.x'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # -----------------------------------------------------------------------
      # License header gate (moved here from the retired CI workflow)
      # -----------------------------------------------------------------------
      # v2.0.8 batch1: every C/C++ file under src/ must carry GPL text or be
      # whitelisted (third-party/generated). Fails fast, before the vcpkg
      # restore. Registry: scripts/license_headers/third_party_whitelist.json
      # Plan: docs/history/plans/FCEUX11-v2.0.8_*.md section 2 (batch 1)
      #
      # v2.0.9: this check used to live in the CI workflow, which is now
      # retired -- this workflow is the only one that builds and tests.
      - name: License header check
        run: python scripts/license_headers/check.py

      # -----------------------------------------------------------------------
      # Cache
      # -----------------------------------------------------------------------
      # R4-0 (2026-07-31) — the previous cache configuration never produced a
      # single usable entry, which is why every run cold-built Qt from source:
      #   * `path: vcpkg_installed` pointed at the repo root, but manifest mode
      #     installs under the CMake binary dir (`build/vcpkg_installed/...`),
      #     so the cached directory was empty.
      #   * the second path entry expanded to `\vcpkg\archives` (empty
      #     LOCALAPPDATA), so the binary cache was not preserved either.
      # Fix: the configure step below pins VCPKG_INSTALLED_DIR to the repo root
      # so this path is the real install tree, AND on the next run
      # CMakeLists.txt:7 sees `vcpkg_installed/x64-windows`, appends it to
      # CMAKE_PREFIX_PATH and skips vcpkg/manifest mode altogether.
      #
      # The path list is deliberately NARROW: `vcpkg_installed/vcpkg/blds`
      # (buildtrees) and `.../pkgs` are multi-GB and are not needed to consume
      # an install tree, so they must stay out of the cache. `status` + `info`
      # are ~500 KB and are kept only as insurance for the case where the
      # prefer-local branch does not fire and manifest mode runs anyway — with
      # them present vcpkg recognises the ports as already installed.
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed/x64-windows
            vcpkg_installed/vcpkg/status
            vcpkg_installed/vcpkg/info
            vcpkg_bincache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-

      # Cache Rust
      # v2.0.4 r17: the toolchain version is part of the key — cargo's target
      # dir is not reusable across compilers, and sharing one cache between
      # two toolchain versions only makes both of them rebuild.
      #
      # v2.0.9: `build/src/rust/target` joins the list. The CMake-driven
      # cargo build does NOT use `src/rust/target` — src/rust/CMakeLists.txt:34
      # sets CARGO_TARGET_DIR to ${CMAKE_CURRENT_BINARY_DIR}/target, i.e.
      # build/src/rust/target — so the cache never covered it and every CI
      # run recompiled the whole Rust dependency graph (gba-core alone is
      # 22K lines) from scratch. With it cached, the CMake Rust build becomes
      # incremental and the "Rust crate lock tests" steps below reuse the same
      # dependency artifacts.
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            src/rust/target
            build/src/rust/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-f11qa-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('src/rust/Cargo.lock') }}
          restore-keys: |
            rust-f11qa-${{ env.RUST_TOOLCHAIN }}-

      # -----------------------------------------------------------------------
      # Build C++ project (with tests)
      # -----------------------------------------------------------------------
      # R4-0: vcpkg creates its binary-cache directory on demand on most
      # versions; this is defensive so a cold run cannot fail on a missing dir.
      - name: Prepare vcpkg binary cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg_bincache" | Out-Null

      - name: Announce cold vcpkg build
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::vcpkg cache miss - this run must build all manifest ports from source (Qt 6.8.0 included). Expect the configure step to take 60+ minutes. Subsequent runs restore the cache and skip vcpkg entirely."

      # R4-0: the two -DVCPKG_* flags are the load-bearing part of the fix.
      #   * VCPKG_INSTALLED_DIR moves the install tree from
      #     `build/vcpkg_installed` to the repo root, which is (a) the path the
      #     cache step above preserves, (b) the path CMakeLists.txt:7 probes to
      #     skip vcpkg on warm runs, and (c) the path tests/CMakeLists.txt:431
      #     already injects into every ctest's PATH so test executables can
      #     resolve Qt6Core.dll / SDL2.dll. Before this flag, (c) pointed at a
      #     non-existent directory on CI and the tests only survived because
      #     the vcpkg toolchain's applocal deployment copied DLLs next to each
      #     exe — a mechanism that does not exist on the warm/bypass path.
      #   * VCPKG_OVERLAY_TRIPLETS activates cmake/triplets/x64-windows.cmake,
      #     which is release-only; see that file's header for the rationale.
      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DFCEUX11_BUILD_TESTS=ON
          -DFCEUX11_ENABLE_RUST=ON
          -DENABLE_LINT_CPPCHECK=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets

      - name: Build C++
        run: cmake --build build --config Release --parallel

      # -----------------------------------------------------------------------
      # Pre-flight — kgmqa-117 mirror_snapshot_check
      # -----------------------------------------------------------------------
      # v1.8 §四 §4.5: kgmqa-117 必须在所有 rom-suite 用例之前 PASS，否则 fetch
      # 出来的 ROM 与 tests.json mirror_ref 不一致，整套 78 项 rom-suite 都是
      # 假数据。静态检查（--skip-fetch）足以捕获 schema / license / mirror_ref
      # 不一致；完整 fetch（含 git clone mirror + SHA-256SUMS 校验）由 Phase 9
      # Linux runner 实跑。
      - name: Pre-flight — kgmqa-117 mirror_snapshot_check
        shell: pwsh
        run: |
          Write-Host "python: $(Get-Command python | Select-Object -ExpandProperty Source)"
          python --version
          python -X utf8 tests/f11qa/mirror_snapshot_check.py --skip-fetch
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::kgmqa-117 mirror_snapshot_check FAILED - mirror pin / license accepted set / mirror_ref 一致性 任一项不通过会阻塞所有 rom-suite 用例"
            exit 1
          }

      # -----------------------------------------------------------------------
      # Build F11QA Rust runner
      # -----------------------------------------------------------------------
      - name: Build f11qa-runner
        working-directory: src/rust
        run: |
          cargo build --release -p f11qa
          # SubprocessAdapter resolves bare names in --bin-dir (build/tests).
          # Stage the Rust CLIs next to the C++ test exes so rom-suite cases
          # (binary: f11qa-rom-runner) and matrix host can be spawned.
          Copy-Item target/x86_64-pc-windows-msvc/release/f11qa-rom-runner.exe ${{ github.workspace }}/build/tests/ -Force
          Copy-Item target/x86_64-pc-windows-msvc/release/f11qa-runner.exe ${{ github.workspace }}/build/tests/ -Force

      # -----------------------------------------------------------------------
      # Test ROM fixtures (硬件一致性检测 + rom-suite 用例)
      # -----------------------------------------------------------------------
      # v1.8 §四 §4.6: 单 fetch 脚本取代 v1.17 的 22 个 download_<suite>_roms.ps1
      # download_blargg_roms.ps1 只下 blargg 套件；fetch_roms_from_mirror.py
      # 接管整个 Laffinty/f11qa-rom-mirror 镜像源（21 个 suite 目录，约 191 ROM）。
      # Python 而非 PowerShell：避免 PowerShell 5.1 ConvertFrom-Json UTF-8 解析
      # 硬限制（v1.8 plan 5.4 §5.4 决策）。
      #
      # CI 调用：python scripts/fetch_roms_from_mirror.py
      # --pin tests/fixtures/f11qa_mirror_pin.json
      # --tests-json tests/tests.json
      # --output-dir tests/fixtures
      # exit code != 0 ⇒ 整套 rom-suite 用例都失去 fixture ground truth。
      - name: Cache f11qa ROM fixtures
        id: cache-f11qa-roms
        uses: actions/cache@v4
        with:
          path: tests/fixtures/_mirror_snapshot
          key: f11qa-roms-${{ hashFiles('tests/fixtures/f11qa_mirror_pin.json', 'scripts/fetch_roms_from_mirror.py') }}
          restore-keys: f11qa-roms-

      - name: Fetch test ROMs from mirror
        shell: pwsh
        run: |
          python scripts/fetch_roms_from_mirror.py `
            --pin tests/fixtures/f11qa_mirror_pin.json `
            --tests-json tests/tests.json `
            --output-dir tests/fixtures
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::fetch_roms_from_mirror.py exit=$LASTEXITCODE - 镜像源 fetch 失败，rom-suite 用例无 fixture"
            exit 1
          }

      # blargg_manifest.json 的 177 条 path 用的是 christopherpow 下载器命名
      # （apu_01_len_ctr.nes）；f11qa-rom-mirror 里的同套件是另一套命名
      # （apu_test_1-len_ctr.nes），basename 仅 14/177 重合。硬件一致性检测 必须用
      # download_blargg_roms.ps1 落盘的目录树，否则 LoadGame 全挂 0xFE。
      # v2.0.9: migrated from the retired CI workflow, which cached the
      # blargg ROM tree before downloading it. The cache key is unchanged,
      # so the entry the old workflow produced is still reused.
      - name: Cache blargg ROMs
        id: cache-blargg
        uses: actions/cache@v4
        with:
          path: tests/fixtures/blargg
          key: blargg-roms-${{ hashFiles('scripts/download_blargg_roms.ps1') }}
          restore-keys: blargg-roms-

      - name: Download blargg suite ROMs (Hardware Consistency Check fixtures)
        shell: pwsh
        run: |
          if (-not (Test-Path tests/fixtures/blargg_manifest.json)) {
            Write-Host "::error::blargg_manifest.json missing"
            exit 1
          }
          powershell -ExecutionPolicy Bypass -File scripts/download_blargg_roms.ps1
          if ($LASTEXITCODE -ne 0) {
            Write-Host "::error::download_blargg_roms.ps1 exit=$LASTEXITCODE"
            exit 1
          }
          # Validate against manifest paths (mirror deploy uses different basenames,
          # so a raw *.nes count is not enough).
          $missing = python -c "import json,pathlib; m=json.load(open('tests/fixtures/blargg_manifest.json',encoding='utf-8-sig')); miss=[r['path'] for r in m['roms'] if not pathlib.Path('tests', r['path']).exists()]; print(len(miss)); [print('MISS', x) for x in miss[:10]]"
          $missCount = [int]($missing | Select-Object -First 1)
          Write-Host "blargg manifest paths missing: $missCount / 177"
          if ($missCount -gt 0) {
            Write-Host "::error::$missCount blargg ROM paths missing from manifest layout; Hardware Consistency Check cannot run"
            exit 1
          }

      # -----------------------------------------------------------------------
      # Internal Logic Check — CTest regression suite
      # -----------------------------------------------------------------------
      # v2.0.9: this step replaces the previous one, which carried
      # `continue-on-error: true` and therefore swallowed every ctest
      # failure. It now uses the strict version from the retired CI workflow:
      # a failing test fails the job.
      #
      # The ctest output is ALSO mirrored into the job summary. The job log
      # can only be downloaded with admin rights ("Must have admin rights to
      # Repository"), so until now a failing ctest was visible to nobody
      # without repo admin access: the only symptom was "Process completed
      # with exit code 1". The step summary is readable through the public
      # check-runs API (output.summary), so this makes a CI failure
      # diagnosable without admin rights.
      #
      # v2.0.8 r9: prepend the vcpkg runtime dir so the test exes can
      # resolve SDL2.dll / Qt6*.dll. Without it the Windows loader raises
      # the missing-DLL dialog, which blocks forever on a runner without an
      # interactive desktop -- the test then dies at the ctest timeout with
      # no output at all. ctest also injects the dir via
      # ENVIRONMENT_MODIFICATION (all tests, since v2.0.8 r9); this line
      # keeps the step independent of that mechanism.
      #
      # -LE perf excludes the "perf"-labelled bench_tolerance_test from the
      # gating run: wall-clock benchmarks are advisory on shared runners
      # (inter-host variance >> tolerance). It runs separately in the
      # "Bench tolerance gate" step below with continue-on-error.
      - name: Internal Logic Check — CTest
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          "## CTest run" | Set-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          ctest --test-dir build --build-config Release --output-on-failure -LE perf 2>&1 | Tee-Object -FilePath ctest-output.txt
          $ctestExit = $LASTEXITCODE
          Get-Content ctest-output.txt -Tail 800 | Add-Content -Path $env:GITHUB_STEP_SUMMARY -Encoding utf8
          # v2.0.8: name the failing tests directly as annotations - the
          # check-run output.summary proved unreliable in practice, but the
          # annotations endpoint is readable without admin rights. ctest
          # marks a failed/timed-out test line with "***" (e.g.
          # "10/50 Test #10: name ...***Failed"). Cap at 10 annotations/step.
          Get-Content ctest-output.txt | Select-String -Pattern "\*\*\*" | Select-Object -First 5 | ForEach-Object { Write-Host ("::error::FAILED-TEST " + $_.Line) }
          Get-Content ctest-output.txt | Select-String -Pattern "movie.roundtrip|WATCHDOG|sram_flush|The following tests FAILED" | Select-Object -First 3 | ForEach-Object { Write-Host ("::error::" + $_.Line) }
          # v2.0.8 r8: the sram_flush_test watchdog prints its phase markers
          # on stderr; ctest captures them into the test output, so surface
          # them as annotations too (stderr is unbuffered, so the markers
          # survive a kill - unlike stdout, which is block-buffered).
          Get-Content ctest-output.txt | Select-String -Pattern "sram_flush" | Select-Object -First 12 | ForEach-Object { Write-Host ("::error::PHASE " + $_.Line) }
          $stageLog = "tests/movie_roundtrip_stages.log"
          if (Test-Path $stageLog) {
            Write-Host ("::error::--- {0} ---" -f $stageLog)
            Get-Content $stageLog | Select-Object -First 2 | ForEach-Object { Write-Host ("::error::STAGE " + $_) }
          } else {
            Write-Host ("::error::stage log missing: {0} (test never started, or cwd differs)" -f $stageLog)
          }
          $lastLog = "build/Testing/Temporary/LastTest.log"
          if (Test-Path $lastLog) {
            Get-Content $lastLog | Select-String -Pattern "movie-roundtrip|movie_roundtrip_test" | Select-Object -First 40 | ForEach-Object { Write-Host ("::error::LASTTEST " + $_.Line) }
          }
          exit $ctestExit


      # -----------------------------------------------------------------------
      # Static drift checks + ROM regression + benchmarks
      # -----------------------------------------------------------------------
      # v2.0.9: migrated from the retired CI workflow. That workflow built
      # the same tree this one builds and ran the same ctest command, so
      # every push paid for two full Release builds (LTCG: ~57 link steps
      # each) and two ctest runs. The checks below were the only ones the
      # retired workflow had, and they are kept verbatim.
      #
      # R4-1 (2026-08-07): these steps invoke the built test .exe directly
      # (not via ctest), so they do NOT inherit the vcpkg runtime PATH that
      # tests/CMakeLists.txt injects via ENVIRONMENT_MODIFICATION
      # (_FCEUX11_TEST_PATH_MODIFICATIONS). fceux11_*_test.exe link against
      # vcpkg DLLs (Qt6Core.dll, SDL2.dll, z.dll, ...); without the vcpkg
      # bin dir on PATH the exe fails at startup with STATUS_DLL_NOT_FOUND
      # (0xC0000135). Prepend the vcpkg install tree -- which configure
      # pins to ${{ github.workspace }}/vcpkg_installed via
      # -DVCPKG_INSTALLED_DIR.

      # v1.3 Legion Phase 7.2: Golden savestate drift check.
      # If any of the SFORMAT-emitting sources have changed, the golden
      # .fc0 files in tests/fixtures/golden/ may now be stale. We do NOT
      # regenerate on CI (that would mask real regressions by overwriting
      # the committed baseline); instead we surface the diff to the PR
      # author so they can run --generate locally and commit the new
      # .fc0 files alongside the source change.
      - name: Golden savestate drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD | Where-Object {
              $_ -match '^src/state\.cpp$' -or
              $_ -match '^src/x6502\.cpp$' -or
              $_ -match '^src/ppu\.cpp$' -or
              $_ -match '^src/sound\.cpp$' -or
              $_ -match '^src/cpu\.cpp$' -or
              $_ -match '^src/cpu\.h$' -or
              $_ -match '^tests/fixtures/golden/golden_savestate_test\.cpp$'
          }
          if ($changed) {
              Write-Host "::warning::Golden-regenerating files changed:"
              $changed | ForEach-Object { Write-Host "  - $_" }
              Write-Host "::warning::The golden .fc0 files in tests/fixtures/golden/ may now be stale."
              Write-Host "::warning::Please run locally on a Release build and commit the result:"
              Write-Host "::warning::  cd tests"
              Write-Host "::warning::  ../build/tests/fceux11_golden_savestate_test.exe --generate"
              Write-Host "::warning::Then push the updated .fc0 files and golden_index.json."
          } else {
              Write-Host "No SFORMAT-emitting sources changed; golden is in sync."
          }

      # v1.3 Legion Phase 7.2 (optional): --compare-layout diagnostic.
      # Runs the layout comparison as an advisory step. The exit code is
      # captured but the workflow does not fail on layout drift here
      # (that's what the dedicated golden_savestate_test ctest is for);
      # the value of this step is the per-chunk diff output that pinpoints
      # the source of any drift.
      - name: Golden layout compare (advisory)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/tests
        shell: pwsh
        run: |
          $exe = "../build/tests/fceux11_golden_savestate_test.exe"
          if (Test-Path $exe) {
              & $exe --compare-layout | Out-File -FilePath golden_compare_layout.log
              Write-Host "Layout compare output saved to golden_compare_layout.log"
              Get-Content golden_compare_layout.log | Select-Object -Last 20
          } else {
              Write-Host "::warning::$exe not built; skipping layout compare."
          }

      # v1.4 Gateway Phase 7.4: Bus dispatch site drift check.
      # If any of the bus-surface sources have changed, mapper_core_test
      # regression coverage is the canary. We surface the changed files
      # to the PR author so they remember to verify mapper_core_test.
      - name: Bus dispatch site drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD | Where-Object {
              $_ -match '^src/boards/.*\.cpp$' -or
              $_ -match '^src/bus\.(cpp|h)$' -or
              $_ -match '^src/cart\.(cpp|h)$'
          }
          if ($changed) {
              Write-Host "::warning::Bus-relevant files changed; verify mapper_core_test stays green."
              Write-Host "::warning::Changed files:"
              $changed | ForEach-Object { Write-Host "  - $_" }
              Write-Host "::warning::Run locally:"
              Write-Host "::warning::  ctest --test-dir build -C Release -R mapper_core_test"
          } else {
              Write-Host "No bus-surface sources changed; coverage still applies."
          }

      # v1.4 Gateway Phase 7.4: hot-path reference-alias drift check.
      # Phase 3 committed to keeping ARead[] / BWrite[] / VPage[] /
      # MMC5SPRVPage[] / MMC5BGVVPage[] direct indexing out of the hot-
      # path files. The ppu.cpp VPage[] / MMC5SPRVPage[] retention and
      # the fceu.cpp handler-registration retention are documented
      # exceptions (§5.1.5 and §5.3.3 of v1.4_Gateway_Build_Plan.md).
      # Any new direct indexing outside those exceptions is a
      # regression of the Phase 3 hot-path migration and should fail the
      # build.
      - name: Hot-path reference-alias drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/src
        shell: pwsh
        run: |
          $hits = git grep -n "ARead\[\|BWrite\[\|VPage\[\|MMC5SPRVPage\[\|MMC5BGVPage\[" -- x6502.cpp ppu.cpp cart.cpp cheat.cpp debug.cpp nsf.cpp lua-engine.cpp 2>$null
          if ($hits) {
              # Documented exceptions (per plan §5.3.4 + §5.1.5):
              # - fceu.cpp (cold-path handler registration)
              # - ppu.cpp VPage[] / MMC5SPRVPage[] (Phase 3 §5.1.5 retention:
              #   MSVC did not inline g_bus.vpage() to the same RIP-relative
              #   machine code as the reference-alias; +6-8% bench regression
              #   caused migration to be rolled back)
              # - ppu.cpp ARead[x]/BWrite[x] lines 1756-1773: PPU register
              #   init (cold path, runs once on Power())
              $hotHits = $hits | Where-Object {
                  $_ -notmatch 'fceu\.cpp' -and
                  -not ($_ -match 'ppu\.cpp' -and $_ -match 'VPage\[|MMC5SPRVPage\[') -and
                  -not ($_ -match 'ppu\.cpp:17[5-7]\d:' -and $_ -match 'ARead\[|BWrite\[')
              }
              if ($hotHits) {
                  Write-Host "::error::Direct reference-alias indexing in hot-path files (must use g_bus.):"
                  $hotHits | ForEach-Object { Write-Host "  $_" }
                  exit 1
              } else {
                  Write-Host "Only documented exceptions present (fceu.cpp cold path + ppu.cpp VPage/MMC5SPRVPage hot-path retention + ppu.cpp PPU-register-init handler registration)."
              }
          } else {
              Write-Host "No direct ARead[] / BWrite[] / VPage[] / MMC5SPRVPage[] / MMC5BGVPage[] indexing in hot-path files."
          }

      # v1.4 Gateway Phase 7.4: board-file direct-array drift check.
      # All 175 board files should route through Bus (inline forwarders
      # or g_bus. direct access). Direct ARead[] / BWrite[] / Page[] /
      # VPage[] / VPageG[] / PRGptr[] / CHRptr[] / MMC5SPRVPage[] /
      # MMC5BGVVPage[] / VPageR[] indexing in board files is a
      # regression of the Phase 4 / Phase 5 board migration batches.
      - name: Board-file direct-array drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/src
        shell: pwsh
        run: |
          $hits = git grep -n "ARead\[\|BWrite\[\|Page\[\|VPage\[\|VPageG\[\|PRGptr\[\|CHRptr\[\|MMC5SPRVPage\[\|MMC5BGVPage\[\|VPageR\[" -- boards/ 2>$null
          if ($hits) {
              # Documented exceptions:
              # - boards/datalatch.cpp VPageR (rule 3 preserved uint8_t** alias)
              # - boards/fns.cpp commented-out PRGptr/CHRptr (lines 207/210 are //)
              # - boards/n106.cpp NTAPage (local static array, not global)
              $boardHits = $hits | Where-Object {
                  $_ -notmatch 'boards/datalatch\.cpp' -and
                  $_ -notmatch 'boards/fns\.cpp:20[78]:' -and
                  $_ -notmatch 'boards/fns\.cpp:21[08]:' -and
                  $_ -notmatch 'boards/n106\.cpp.*NTAPage\['
              }
              if ($boardHits) {
                  Write-Host "::error::Direct array indexing in board files (must use g_bus.):"
                  $boardHits | ForEach-Object { Write-Host "  $_" }
                  exit 1
              } else {
                  Write-Host "Only documented exceptions present (datalatch VPageR / fns comments / n106 NTAPage)."
              }
          } else {
              Write-Host "No direct array indexing in board files."
          }

      - name: ROM Regression Test
        working-directory: ${{ github.workspace }}/tests
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          # v1.17 Task1-C2: Rust rom_regression runner replaces the C++
          # fceux11_rom_regression_test.exe (parity verified; Rust also
          # fixes the C++ first-entry parser miss - nrom is now checked).
          $regTest = "../build/tests/f11qa_rom_regression_runner.exe"
          if (-not (Test-Path "fixtures/golden_hashes.json")) {
            & $regTest --generate
          }
          & $regTest
        shell: pwsh

      - name: Benchmark (smoke)
        working-directory: ${{ github.workspace }}/tests
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          $benchDir = "../build/tests"
          & "$benchDir/fceux11_bench_ppu_render.exe"
          & "$benchDir/fceux11_bench_x6502_exec.exe"
          & "$benchDir/fceux11_bench_apu_mix.exe"
        shell: pwsh

      # v1.3 Legion Phase 7.3: performance baseline gate.
      # Uses the committed v1.3 baseline (tests/fixtures/bench_baseline.json)
      # which is regenerated by maintainers on a dedicated runner. The
      # 2.5% tolerance is the practical floor; tighten to 1% only after
      # moving to a dedicated runner with no other workloads.
      - name: Bench tolerance gate
        # Advisory only: GitHub Actions runner hardware variance routinely
        # exceeds the 2.5% tolerance, so a failure here is not actionable as
        # a code regression. The step still runs and surfaces the numbers
        # (and FAIL line) in the log for visibility.
        continue-on-error: true
        working-directory: ${{ github.workspace }}/tests
        run: |
          if (Test-Path "../build/tests/fceux11_bench_tolerance_test.exe") {
              $env:FCEUX11_BENCH_BASELINE = "fixtures/bench_baseline.json"
              & "../build/tests/fceux11_bench_tolerance_test.exe"
          } else {
              Write-Host "::warning::fceux11_bench_tolerance_test.exe not built; skipping."
          }
        shell: pwsh

      # -----------------------------------------------------------------------
      # Hardware Consistency Check — Blargg $6000 test ROM suite (180 ROM batch)
      # -----------------------------------------------------------------------
      # R4-2 (2026-08-08): prepend the vcpkg bin dir to PATH. On the WARM
      # cache path (vcpkg skipped), applocal deployment does NOT copy Qt/
      # SDL DLLs next to the test exes in build/tests (see the R4-0 comment
      # above). blargg_runner links fceux11_drivers_qt, so without the
      # install-tree bin on PATH the exe dies with STATUS_DLL_NOT_FOUND
      # (0xC0000135). Same pattern as ci.yml's ROM Regression step.
      - name: Hardware Consistency Check — Blargg Suite
        working-directory: tests
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          $runner = "../build/tests/f11qa_blargg_runner.exe"
          if (Test-Path $runner) {
            & $runner --manifest fixtures/blargg_manifest.json 2>&1 | Tee-Object -FilePath ../build/blargg_full_output.txt
            $exitCode = $LASTEXITCODE
            Write-Host "Blargg suite exit code: $exitCode"
          } else {
            Write-Host "::error::f11qa_blargg_runner.exe not built; Hardware Consistency Check cannot run. Expected at $runner"
            exit 1
          }
        shell: pwsh
        continue-on-error: true

      # -----------------------------------------------------------------------
      # F11QA — Migration matrix generation
      # -----------------------------------------------------------------------
      # v1.8 §五 Phase 7: 总用例数从 39 → 120 (kgmqa-001 ~ kgmqa-120)。
      # kgmqa-117 mirror_snapshot_check 已在上一步 (pre-flight) PASS，
      # 这里只生成 matrix + 评分。frozen baseline 由
      # tests/fixtures/f11qa_baseline_frozen.json 提供（Phase 8 将录入 120 项）。
      #
      # R4-2 (2026-08-08): prepend the vcpkg bin dir to PATH. The runner
      # spawns the CTest test exes via SubprocessAdapter, which prepends only
      # bin_dir (build/tests) to the inherited PATH. On the WARM cache path
      # applocal does NOT deploy Qt/SDL DLLs into build/tests (R4-0 comment),
      # so the subprocesses die with STATUS_DLL_NOT_FOUND and every
      # Qt-linking test (incl. smoke_test) is scored FAIL — run #46 exposed
      # this as matrix grade=E on the first warm run.
      - name: F11QA — Migration Matrix
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          $candidates = @(
            "src/rust/target/x86_64-pc-windows-msvc/release/f11qa-runner.exe",
            "src/rust/target/release/f11qa-runner.exe"
          )
          $runner = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $runner) {
            Write-Host "::error::f11qa-runner.exe not found. Looked in:"
            foreach ($c in $candidates) { Write-Host "::error::  $c" }
            exit 1
          }
          Write-Host "Using runner: $runner"
          & $runner `
            --manifest tests/tests.json `
            --bin-dir build/tests `
            --output build/f11qa_migration_matrix.json `
            --accuracy-table build/f11qa_accuracy_table.md `
            --known-fail tests/fixtures/blargg_known_fail.json `
            --baseline tests/fixtures/f11qa_baseline_frozen.json `
            --save-baseline build/f11qa_baseline_next.json `
            --pdf-report build/f11qa_quality_report.pdf
          $exitCode = $LASTEXITCODE
          Write-Host "F11QA runner exit code: $exitCode"
        shell: pwsh
        continue-on-error: true

      # -----------------------------------------------------------------------
      # Upload artifacts
      # -----------------------------------------------------------------------
      - name: Upload F11QA Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: f11qa-results
          path: |
            build/f11qa_migration_matrix.json
            build/f11qa_accuracy_table.md
            build/f11qa_baseline_next.json
            build/blargg_full_output.txt
            build/f11qa_quality_report.pdf
          retention-days: 30

      # -----------------------------------------------------------------------
      # Baseline drift detection (PASS→FAIL alerts)
      # -----------------------------------------------------------------------
      - name: Baseline Drift Detection
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $matrixPath = "build/f11qa_migration_matrix.json"
          if (-not (Test-Path $matrixPath)) {
            Write-Host "::warning::No migration matrix found; skipping drift detection."
            exit 0
          }
          $matrix = Get-Content $matrixPath | ConvertFrom-Json
          $passToFail = $matrix.transition_matrix.pass_to_fail
          if ($passToFail -and $passToFail.Count -gt 0) {
            $msg = "## ⚠️ F11QA Baseline Drift Alert`n`n"
            $msg += "**PASS→FAIL regressions detected:** $($passToFail.Count)`n`n"
            foreach ($entry in $passToFail) {
              $msg += "- ❌ **$($entry.id)**`n"
            }
            $msg += "`n🤖 Generated with [Claude Code](https://claude.com/claude-code)"
            # Post as PR comment using GitHub CLI
            gh pr comment ${{ github.event.pull_request.number }} --body "$msg" 2>$null
            Write-Host "Drift alert posted to PR."
          } else {
            Write-Host "No PASS→FAIL regressions detected. ✓"
          }
        env:
          GH_TOKEN: ${{ github.token }}

      # -----------------------------------------------------------------------
      # Summary
      # -----------------------------------------------------------------------
      - name: Print Summary
        if: always()
        shell: pwsh
        run: |
          Write-Host "========================================"
          Write-Host "F11QA v1.8 CI Run Complete"
          Write-Host "========================================"
          $matrixPath = "build/f11qa_migration_matrix.json"
          if (Test-Path $matrixPath) {
            $m = Get-Content $matrixPath | ConvertFrom-Json
            Write-Host "Total:   $($m.summary.total)"
            Write-Host "Passed:  $($m.summary.passed)"
            Write-Host "Failed:  $($m.summary.failed)"
            Write-Host "Internal Logic Check: $($m.oracle_breakdown.a_regression.pass)P / $($m.oracle_breakdown.a_regression.fail)F"
            Write-Host "Hardware Consistency Check: $($m.oracle_breakdown.b_hardware.pass)P / $($m.oracle_breakdown.b_hardware.fail)F"
            if ($m.summary.vendor_state) {
              Write-Host "Vendor state: vendored=$($m.summary.vendor_state.vendored) advisory=$($m.summary.vendor_state.advisory) pending-vendor=$($m.summary.vendor_state.pending_vendor)"
            }
          }

      # -----------------------------------------------------------------------
      # R4 gate — machine-enforce the acceptance report's falsification criteria
      # -----------------------------------------------------------------------
      # docs/FCEUX11-1.16_最终验收报告.md §十 R4 states the criteria for closing
      # acceptance standard #5, and its 证伪判据: "if CI reports
      # git_rev=\"unknown\" or passed != 35, S-4/D-3 did not take effect in the
      # CI environment — do NOT merge."
      #
      # Until now those criteria lived only in prose, while every substantive
      # step above carries `continue-on-error: true` and "Print Summary" simply
      # prints nothing when the matrix is absent. Run 82956632293 is the proof:
      # the matrix was never produced, and the only trace was a buried
      # `##[warning]No files were found with the provided path`. That is exactly
      # the "it ran but the conclusion is wrong" failure class the report calls
      # more dangerous than an outright build failure (§九.2 item 3).
      #
      # This gate runs `if: always()` and is placed AFTER the artifact upload on
      # purpose: a gate failure must still leave the artifacts downloadable for
      # diagnosis. It fails the job, it does not hide evidence.
      #
      # v1.8 R4 gate strict:
      #   - total == 120 (不是 v1.17 的 total >= 39；v1.8 严格 120 项)
      #   - vendor_state breakdown 通道：vendored / advisory / pending-vendor
      #     数量必须与 tests.json 一致（runner emit summary.vendor_state 字段）
      #   - kgmqa-117 mirror_snapshot_check 已在上一步 (pre-flight) PASS，
      #     这里只校验 summary 字段是否被 runner 正确 emit
      - name: R4 Gate — migration matrix must exist and be sane (v1.8)
        if: always()
        shell: pwsh
        run: |
          $matrixPath = "build/f11qa_migration_matrix.json"
          $failures = @()

          if (-not (Test-Path $matrixPath)) {
            Write-Host "::error::R4 gate: $matrixPath was not produced. The F11QA pipeline did not reach the migration-matrix stage - inspect the earlier steps (configure / build / runner) for the real cause."
            exit 1
          }

          $m = Get-Content $matrixPath -Raw | ConvertFrom-Json

          # S-4: git_rev must be a real commit hash, stamped at compile time via
          # build.rs + option_env!. "unknown" means the stamp did not survive
          # the CI environment and matrices are not traceable to a code state.
          $gitRev = $m.engine.git_rev
          if ([string]::IsNullOrWhiteSpace($gitRev) -or $gitRev -eq 'unknown') {
            $failures += "engine.git_rev is '$gitRev' (expected a real commit short hash; S-4 compile-time stamp did not take effect in CI)"
          }

          # v1.8 §五 Phase 7: 总用例数下限 120 (kgmqa-001 ~ kgmqa-120)。
          #
          # 2026-11-07 修正：原实现用 `-ne 120` 严格相等。基线冻结在 120 项后，
          # A2 批次（062ce84）合法新增了 kgmqa-121（APU 帧计数器锁测试），用例数
          # 变成 121 ⇒ 该判据**确定性失败**，main 的 F11QA 连续 3 个 run（68/69/70）
          # 全部红在同一个 R4 Gate，而当时的 CI 其实没有引入任何回归。
          #
          # 改为 `-lt 120`（下限）而非保持 `-ne`，理由：
          #   ① **与清单自身声明一致**——tests.json 的 policy.r4_gate_thresholds
          #      写的就是 `"total_min": 120`（下限语义），判据却写成严格相等，
          #      两边自相矛盾；
          #   ② **runner 已把基线外用例归入 new_test 桶**并结构性排除出
          #      fail_to_pass / pass_to_fail 四个迁移桶（report/matrix.rs:244-266
          #      的 in_baseline 判定），「新增用例偷偷漏登记」的防作弊目的
          #      **已由 runner 侧承担**，此处再卡总数是重复把关且必然误伤；
          #   ③ 「少 1 个也要失败」的原始意图**仍然保留**：`-lt 120` 判的是
          #      用例被**静默跳过**（总数跌破下限），这正是该判据要防的第一种坏情况；
          #      第二种坏情况（新增未登记）由 ② 覆盖。
          #
          # 冻结基线的期望值未改动（仍 120 项、kgmqa-121 走 new_test 桶）——
          # 本次只改门禁**判据**，不改任何用例的通过/失败期望，符合
          # blargg_known_fail.json 的「AI shall not modify expected values」约定。
          if ($m.summary.total -lt 120) {
            $failures += "summary.total is $($m.summary.total), expected >= 120 (v1.8 下限 120 项 kgmqa-001~120；用例被静默跳过或数量跌破下限。注：基线外的新增用例走 new_test 桶，由 runner 侧 anti-gaming 判定处理，不在此卡总数)"
          }

          # -----------------------------------------------------------------------
          # Transition-matrix gate — v1.18.1 修正（2026-09-27）
          #
          # 原实现把 `fail_to_pass != 0` 当作硬失败，这是**方向反了**：
          # `fail_to_pass` 是「基线 FAIL → 本次 PASS」，即**真实精度进展**的证据。
          # 把它判红会导致「修好一个残留 FAILURE」无法合入（run 98267393461 实测：
          # kgmqa-056 E2/BB 修好后 fail_to_pass=1，R4 gate 直接拒绝，107P/13F 的
          # 成果被卡在门外）。
          #
          # 防刷分（anti-gaming）的职责**已经在 runner 侧完成**，
          # 不需要 CI 再重复拦一遍：
          #   - `report/matrix.rs:257-259` — 不在 baseline 里的 test_id 走独立的
          #     `new_test` 桶，**结构上不可能**混入 fail_to_pass / pass_to_fail；
          #   - `test_set_diff.added/removed` — 显式暴露测试集增减供 review。
          #
          # 因此本门禁改为守真正的红线：**pass_to_fail（回归）必须为 0**。
          # 这正是 `docs/history/plans/FCEUX11-v2.0.2_残留精度与调试待办-review报告.md`
          # §二 沿用的不变式要求（该口径从未要求 fail_to_pass == 0）。
          # -----------------------------------------------------------------------
          $p2f = $m.transition_matrix.pass_to_fail
          $p2fCount = if ($null -eq $p2f) { 0 } elseif ($p2f -is [array]) { $p2f.Count } else { [int]$p2f }
          if ($p2fCount -ne 0) {
            $regressed = @($p2f | ForEach-Object { $_.id }) -join ', '
            $failures += "transition_matrix.pass_to_fail is $p2fCount, expected 0 (REGRESSION: $regressed — 不变式 #2，出现即回滚该 PR)"
          }

          # 精度进展只做记录，不判红：每次真正修好一个残留 FAILURE 都会让
          # fail_to_pass 增长，这是长期演进计划的正反馈信号。
          $f2p = $m.transition_matrix.fail_to_pass
          $f2pCount = if ($null -eq $f2p) { 0 } elseif ($f2p -is [array]) { $f2p.Count } else { [int]$f2p }
          $newTests = $m.transition_matrix.new_test
          $newTestCount = if ($null -eq $newTests) { 0 } elseif ($newTests -is [array]) { $newTests.Count } else { [int]$newTests }
          if ($f2pCount -gt 0) {
            $gained = @($f2p | ForEach-Object { $_.id }) -join ', '
            Write-Host "Progress: fail_to_pass=$f2pCount ($gained) — 精度进展，记录不判红"
          }
          if ($newTestCount -gt 0) {
            Write-Host "new_test=$newTestCount (not in baseline; excluded from all 4 transition buckets by design)"
          }

          # v1.8 vendor_state 通道：runner 必须 emit summary.vendor_state 三态计数
          # （vendored / advisory / pending_vendor），且总数等于 tests.json 的
          # rom-suite 用例数（r21：由硬编码 78 改为从 manifest 推导——
          # 严格相等判据保留，常数不再随门禁增减漂移，81ca5b9 同族教训）。
          # advisory / pending-vendor 不能 fail_to_pass；vendored 失败 = blocking。
          $manifest = Get-Content tests/tests.json -Raw | ConvertFrom-Json
          if (-not $m.summary.vendor_state) {
            $failures += "summary.vendor_state missing (runner must emit vendored/advisory/pending_vendor 三态计数；v1.8 vendor_state 通道未启用)"
          } else {
            $vs = $m.summary.vendor_state
            $vsSum = ([int]$vs.vendored) + ([int]$vs.advisory) + ([int]$vs.pending_vendor)
            $romSuiteCount = @($manifest.cases | Where-Object { $_.kind -contains 'rom-suite' }).Count
            if ($vsSum -ne $romSuiteCount) {
              $failures += "vendor_state 三态总和 is $vsSum (vendored=$($vs.vendored) advisory=$($vs.advisory) pending-vendor=$($vs.pending_vendor))，expected == $romSuiteCount (tests.json rom-suite 用例数)"
            }
          }

          # Task 5 (docs/history/plans/FCEUX11-1.17_计划.md §6): release-readiness grade. D/E
          # means a blocking failure or regression (D) or a broken engine
          # boot (E) — either forbids merging.
          $grade = $m.grade
          if ($null -eq $grade -or $grade -eq '') {
            $failures += "matrix grade is missing (Task 5 grade field not emitted by runner)"
          } elseif ($grade -eq 'D' -or $grade -eq 'E') {
            $failures += "matrix grade is $grade (D/E are release-blocking: blocking failure, regression, or engine-boot failure)"
          }

          # Advisory known-limit guard (precision.md §4): failing advisory cases
          # must stay <= 15% of the suite. Prevents diluting grade B by dumping
          # hard tests into advisory without review.
          try {
            $manifest = Get-Content tests/tests.json -Raw | ConvertFrom-Json
            $advFail = 0
            $failIds = @($m.details | Where-Object { -not $_.passed } | ForEach-Object { $_.test_id })
            foreach ($c in $manifest.cases) {
              if ($c.failure_means -eq 'advisory' -and $failIds -contains $c.kgmqa_id) { $advFail++ }
            }
            $total = [int]$m.summary.total
            $advPct = if ($total -gt 0) { [math]::Round(100.0 * $advFail / $total, 1) } else { 0 }
            Write-Host "Advisory-FAIL: $advFail / $total = $advPct% (cap 15%)"
            if ($advPct -gt 15) {
              $failures += "advisory-FAIL ratio ${advPct}% ($advFail/$total) exceeds 15% cap (precision.md section 4; do not dump blocking tests into advisory without review)"
            }
          } catch {
            $failures += "advisory-FAIL ratio check failed to run: $($_.Exception.Message)"
          }

          if ($failures.Count -gt 0) {
            foreach ($f in $failures) { Write-Host "::error::R4 gate: $f" }
            Write-Host "::error::R4 gate failed - per the acceptance report section 10 R4 falsification criteria, do NOT merge until this is resolved."
            exit 1
          }

          Write-Host "R4 gate passed: git_rev=$gitRev, total=$($m.summary.total), passed=$($m.summary.passed), failed=$($m.summary.failed), grade=$grade, pass_to_fail=$p2fCount, fail_to_pass=$f2pCount, new_test=$newTestCount, vendor_state={v=$($vs.vendored) a=$($vs.advisory) p=$($vs.pending_vendor)} [OK]"

      # -----------------------------------------------------------------------
      # Rust crate lock tests (v2.0.9)
      # -----------------------------------------------------------------------
      # Before v2.0.9 no `cargo test` ran in CI at all: the workspace's
      # ~1197 Rust lock tests only ran on a maintainer's machine. That is
      # exactly the "a test that never runs is not a test" case AGENTS.md
      # discipline 10 records, and it has bitten this repo twice already:
      # gba-core's 242 tests were UNREACHABLE rather than failing (the
      # vendoring dropped their [dev-dependencies], so they did not even
      # compile), and fceux11-debug / fceux11-media were in no gate command
      # at all.
      #
      # These steps run at the END of the job on purpose. The root crate has
      # to be tested with different features than the CMake build uses -- the
      # `direct-adapter` feature references C++ symbols that only exist in
      # the emulator executable, so the test binary would not link
      # (AGENTS.md pit 2) -- and that recompiles the root crate with `gba`
      # only, rewriting the shared
      # build/src/rust/target/.../release/fceux11_rust.lib and regenerating
      # src/rust/fceux11_rust.h. Nothing compiles C++ after this point, so
      # that has no effect; running it earlier would.
      #
      # PROFILE: the default (test/dev) profile, NOT --release -- and that is
      # measured, not preferred. Four gba-core lock tests are
      # `#[should_panic]` on `debug_assert!` bounds checks
      # (crates/gba-core/src/bitwise.rs:18/25/32 and
      # cpu/arm7tdmi.rs:1933): in a release build `debug_assertions` is off,
      # nothing panics, and those four tests fail ("test did not panic as
      # expected"). Running the gate with --release would make CI
      # permanently red on four tests that are correct in the profile they
      # were written for. The same commands as the local gate (AGENTS.md
      # 门禁 section) are used here, and their output directory
      # (src/rust/target) is already covered by the "Cache Rust" step.
      #
      # ⚠️ **SHELL: use the default (pwsh), NOT `shell: bash`** ⚠️
      #
      # The first version of these two steps used `shell: bash` and the
      # whole gate failed on the first CI run with exit code 101:
      #
      #   note: /usr/bin/link: extra operand '...build_script_build...rcgu.o'
      #   error: could not compile `proc-macro2` (build script)
      #
      # Cause (reproduced locally): under `shell: bash` the runner's PATH
      # puts `C:\Program Files\Git\usr\bin` ahead of MSVC's bin dir, and
      # **Git's `usr\bin\link.exe` is the MSYS `ln`**, not Microsoft's
      # linker. cargo invokes `link.exe` by name, so it got the wrong one
      # and every crate with a build script failed to link. With MSVC's
      # bin dir first (which is what the default pwsh shell and the
      # working "Build f11qa-runner" step above have) the same command
      # succeeds.
      #
      # A failing cargo test still fails the step: pwsh propagates
      # $LASTEXITCODE as the step's exit code (observed: the failed step
      # reported 101 = cargo's own exit code).
      #
      # `--all-targets` = unit tests + integration tests, WITHOUT doctests.
      # Plain `cargo test` also runs doctests, and the vendored gba-core's
      # doc examples do not compile in this tree -- they are upstream's and
      # reference an `emu::` module that the vendored layout does not have:
      #   error[E0433]: cannot find module or crate `emu` in this scope
      #   error: doctest failed, to rerun pass `-p gba-core --doc`
      # The vendor tree is not to be edited for that, so the doctests are
      # excluded here. No coverage is lost: gba-core is the only crate in
      # this group that has any doc examples at all.
      - name: Rust crate lock tests (dependency crates)
        working-directory: ${{ github.workspace }}/src/rust
        run: cargo test --all-targets -p gba-core -p fceux11-core -p fceux11-formats -p fceux11-media -p fceux11-debug -p fceux11-utils -p fceux11-lua -p f11qa -p fceux11-rom-tests

      # The root crate is ours (not vendored) and its doctests pass, so they
      # are left in.
      - name: Rust crate lock tests (root crate)
        working-directory: ${{ github.workspace }}/src/rust
        run: cargo test -p fceux11-rust --no-default-features --features gba
