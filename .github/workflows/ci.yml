# FCEUX11 v0.3.2 — CI Workflow
# Stages: configure → build → lint → ctest → rom_regression → benchmark

name: CI

on:
  push:
    branches: [main, topic/v0.3.x-*]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (Ninja)
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DFCEUX11_BUILD_TESTS=ON
          -DENABLE_LINT=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Lint (optional)
        run: |
          bash tools/lint/format-check.sh || true
        shell: bash

      - name: CTest
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: ROM Regression Test
        working-directory: ${{ github.workspace }}/tests
        run: |
          $regTest = "../build/tests/fceux11_rom_regression_test.exe"
          if (-not (Test-Path "fixtures/golden_hashes.json")) {
            & $regTest --generate
          }
          & $regTest
        shell: pwsh

      - name: Benchmark (smoke)
        working-directory: ${{ github.workspace }}/tests
        run: |
          $benchDir = "../build/tests"
          & "$benchDir/fceux11_bench_ppu_render.exe"
          & "$benchDir/fceux11_bench_x6502_exec.exe"
          & "$benchDir/fceux11_bench_apu_mix.exe"
        shell: pwsh
