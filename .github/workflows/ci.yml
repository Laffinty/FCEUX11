# FCEUX11 v0.3.2 — CI Workflow
# Stages: configure → build → ctest → rom_regression → benchmark
# (lint stage removed 2026-06-11: project is MSVC-only, no clang toolchain;
#  cppcheck-check.sh remains available locally under tools/lint/ but is not
#  wired into CI.)
#
# v0.3.7: Replaced microsoft/setup-msbuild@v2 with ilammy/msvc-dev-cmd@v1.
# setup-msbuild only locates MSBuild; it does not load vcvars64.bat, so
# cl.exe is not on PATH for the downstream cmake configure step on newer
# windows-2022 runner images (Image Version 20260607.193.1 onward). The
# msvc-dev-cmd action runs vcvars64.bat and exports PATH/INCLUDE/LIB so
# that `cmake -DCMAKE_CXX_COMPILER=cl ...` resolves cl. This is the only
# difference from the v0.3.6.6 workflow.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed
            ${{ env.LOCALAPPDATA }}\vcpkg\archives
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-

      # v0.3.7: Load vcvars64.bat via msvc-dev-cmd so cl.exe is on PATH
      # for the cmake configure step. The previous microsoft/setup-msbuild@v2
      # only located MSBuild, not the C/C++ compiler toolchain; on
      # windows-2022 Image 20260607.193.1 this caused the configure step to
      # fail with "CMAKE_CXX_COMPILER: cl ... not found in the PATH".
      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # v0.3.2: Project requires CMake 4.0+; GitHub-hosted windows-2022 only ships
      # with 3.31.6, so install CMake 4.0 via lukka/get-cmake and prepend it to PATH.
      # v0.3.7: input name fixed to `cmakeVersion` (was `cmake-version`,
      # which the action logs as an unrecognised input warning).
      - name: Setup CMake 4.0
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.0.x'

      - name: Configure CMake (Ninja)
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DFCEUX11_BUILD_TESTS=ON
          -DENABLE_LINT_CPPCHECK=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: CTest
        run: ctest --test-dir build --build-config Release --output-on-failure

      # v1.3 Legion Phase 7.2: Golden savestate drift check.
      # If any of the SFORMAT-emitting sources have changed, the golden
      # .fc0 files in tests/fixtures/golden/ may now be stale. We do NOT
      # regenerate on CI (that would mask real regressions by overwriting
      # the committed baseline); instead we surface the diff to the PR
      # author so they can run --generate locally and commit the new
      # .fc0 files alongside the source change.
      - name: Golden savestate drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD | Where-Object {
              $_ -match '^src/state\.cpp$' -or
              $_ -match '^src/x6502\.cpp$' -or
              $_ -match '^src/ppu\.cpp$' -or
              $_ -match '^src/sound\.cpp$' -or
              $_ -match '^src/cpu\.cpp$' -or
              $_ -match '^src/cpu\.h$' -or
              $_ -match '^tests/fixtures/golden/golden_savestate_test\.cpp$'
          }
          if ($changed) {
              Write-Host "::warning::Golden-regenerating files changed:"
              $changed | ForEach-Object { Write-Host "  - $_" }
              Write-Host "::warning::The golden .fc0 files in tests/fixtures/golden/ may now be stale."
              Write-Host "::warning::Please run locally on a Release build and commit the result:"
              Write-Host "::warning::  cd tests"
              Write-Host "::warning::  ../build/tests/fceux11_golden_savestate_test.exe --generate"
              Write-Host "::warning::Then push the updated .fc0 files and golden_index.json."
          } else {
              Write-Host "No SFORMAT-emitting sources changed; golden is in sync."
          }

      # v1.3 Legion Phase 7.2 (optional): --compare-layout diagnostic.
      # Runs the layout comparison as an advisory step. The exit code
      # is captured but the workflow does not fail on layout drift here
      # (that's what the dedicated golden_savestate_test ctest is for);
      # the value of this step is the per-chunk diff output that pinpoints
      # the source of any drift.
      - name: Golden layout compare (advisory)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/tests
        shell: pwsh
        run: |
          $exe = "../build/tests/fceux11_golden_savestate_test.exe"
          if (Test-Path $exe) {
              & $exe --compare-layout | Out-File -FilePath golden_compare_layout.log
              Write-Host "Layout compare output saved to golden_compare_layout.log"
              Get-Content golden_compare_layout.log | Select-Object -Last 20
          } else {
              Write-Host "::warning::$exe not built; skipping layout compare."
          }

      # v1.4 Gateway Phase 7.4: Bus dispatch site drift check.
      # If any of the bus-surface sources have changed, mapper_core_test
      # regression coverage is the canary. We surface the changed files
      # to the PR author so they remember to verify mapper_core_test.
      - name: Bus dispatch site drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD | Where-Object {
              $_ -match '^src/boards/.*\.cpp$' -or
              $_ -match '^src/bus\.(cpp|h)$' -or
              $_ -match '^src/cart\.(cpp|h)$'
          }
          if ($changed) {
              Write-Host "::warning::Bus-relevant files changed; verify mapper_core_test stays green."
              Write-Host "::warning::Changed files:"
              $changed | ForEach-Object { Write-Host "  - $_" }
              Write-Host "::warning::Run locally:"
              Write-Host "::warning::  ctest --test-dir build -C Release -R mapper_core_test"
          } else {
              Write-Host "No bus-surface sources changed; coverage still applies."
          }

      # v1.4 Gateway Phase 7.4: hot-path reference-alias drift check.
      # Phase 3 committed to keeping ARead[] / BWrite[] / VPage[] /
      # MMC5SPRVPage[] / MMC5BGVVPage[] direct indexing out of the hot-
      # path files. The ppu.cpp VPage[] / MMC5SPRVPage[] retention and
      # the fceu.cpp handler-registration retention are documented
      # exceptions (§5.1.5 and §5.3.3 of v1.4_Gateway_Build_Plan.md).
      # Any new direct indexing outside these exceptions is a
      # regression of the Phase 3 hot-path migration and should fail
      # the build.
      - name: Hot-path reference-alias drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/src
        shell: pwsh
        run: |
          $hits = git grep -n "ARead\[\|BWrite\[\|VPage\[\|MMC5SPRVPage\[\|MMC5BGVPage\[" -- x6502.cpp ppu.cpp cart.cpp cheat.cpp debug.cpp nsf.cpp lua-engine.cpp 2>$null
          if ($hits) {
              # Documented exceptions:
              # - fceu.cpp (cold-path handler registration)
              # - ppu.cpp VPage[] / MMC5SPRVPage[] (Phase 3 §5.1.5 retention)
              $hotHits = $hits | Where-Object {
                  $_ -notmatch 'fceu\.cpp' -and
                  -not ($_ -match 'ppu\.cpp' -and $_ -match 'VPage\[|MMC5SPRVPage\[')
              }
              if ($hotHits) {
                  Write-Host "::error::Direct reference-alias indexing in hot-path files (must use g_bus.):"
                  $hotHits | ForEach-Object { Write-Host "  $_" }
                  exit 1
              } else {
                  Write-Host "Only documented exceptions present (fceu.cpp cold path + ppu.cpp VPage/MMC5SPRVPage hot-path retention)."
              }
          } else {
              Write-Host "No direct ARead[]/BWrite[]/VPage[]/MMC5SPRVPage[]/MMC5BGVPage[] indexing in hot-path files. ✓"
          }

      # v1.4 Gateway Phase 7.4: board-file direct-array drift check.
      # All 175 board files should route through Bus (inline forwarders
      # or g_bus. direct access). Direct ARead[] / BWrite[] / Page[] /
      # VPage[] / VPageG[] / PRGptr[] / CHRptr[] / MMC5SPRVPage[] /
      # MMC5BGVPage[] / VPageR[] indexing in board files is a
      # regression of the Phase 4 / Phase 5 board migration batches.
      - name: Board-file direct-array drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/src
        shell: pwsh
        run: |
          $hits = git grep -n "ARead\[\|BWrite\[\|Page\[\|VPage\[\|VPageG\[\|PRGptr\[\|CHRptr\[\|MMC5SPRVPage\[\|MMC5BGVPage\[\|VPageR\[" -- boards/ 2>$null
          if ($hits) {
              # Documented exceptions:
              # - boards/datalatch.cpp VPageR (rule 3 preserved uint8_t** alias)
              # - boards/fns.cpp commented-out PRGptr/CHRptr (lines 207/210 are //)
              # - boards/n106.cpp NTAPage (local static array, not global)
              $boardHits = $hits | Where-Object {
                  $_ -notmatch 'boards/datalatch\.cpp' -and
                  $_ -notmatch 'boards/fns\.cpp:20[78]:' -and
                  $_ -notmatch 'boards/fns\.cpp:21[08]:' -and
                  $_ -notmatch 'boards/n106\.cpp.*NTAPage\['
              }
              if ($boardHits) {
                  Write-Host "::error::Direct array indexing in board files (must use g_bus.):"
                  $boardHits | ForEach-Object { Write-Host "  $_" }
                  exit 1
              } else {
                  Write-Host "Only documented exceptions present (datalatch VPageR / fns comments / n106 NTAPage)."
              }
          } else {
              Write-Host "No direct array indexing in board files. ✓"
          }

      - name: ROM Regression Test
        working-directory: ${{ github.workspace }}/tests
        run: |
          $regTest = "../build/tests/fceux11_rom_regression_test.exe"
          if (-not (Test-Path "fixtures/golden_hashes.json")) {
            & $regTest --generate
          }
          & $regTest
        shell: pwsh

      - name: Benchmark (smoke)
        working-directory: ${{ github.workspace }}/tests
        run: |
          $benchDir = "../build/tests"
          & "$benchDir/fceux11_bench_ppu_render.exe"
          & "$benchDir/fceux11_bench_x6502_exec.exe"
          & "$benchDir/fceux11_bench_apu_mix.exe"
        shell: pwsh

      # v1.3 Legion Phase 7.3: performance baseline gate.
      # Uses the committed v1.3 baseline (tests/fixtures/bench_baseline.json)
      # which is regenerated by maintainers on a dedicated runner. The
      # 2.5% tolerance is the practical floor; tighten to 1% only after
      # moving to a dedicated runner with no other workloads.
      - name: Bench tolerance gate
        working-directory: ${{ github.workspace }}/tests
        run: |
          if (Test-Path "../build/tests/fceux11_bench_tolerance_test.exe") {
            $env:FCEUX11_BENCH_BASELINE = "fixtures/bench_baseline.json"
            & "../build/tests/fceux11_bench_tolerance_test.exe"
          } else {
            Write-Host "::warning::fceux11_bench_tolerance_test.exe not built; skipping."
          }
        shell: pwsh
