# FCEUX11 v0.3.2 — CI Workflow
# Stages: configure → build → ctest → rom_regression → benchmark
# (lint stage removed 2026-06-11: project is MSVC-only, no clang toolchain;
#  cppcheck-check.sh remains available locally under tools/lint/ but is not
#  wired into CI.)
#
# v0.3.7: Replaced microsoft/setup-msbuild@v2 with ilammy/msvc-dev-cmd@v1.
# setup-msbuild only locates MSBuild; it does not load vcvars64.bat, so
# cl.exe is not on PATH for the downstream cmake configure step on newer
# windows-2022 runner images (Image Version 20260607.193.1 onward). The
# msvc-dev-cmd action runs vcvars64.bat and exports PATH/INCLUDE/LIB so
# that `cmake -DCMAKE_CXX_COMPILER=cl ...` resolves cl. This is the only
# difference from the v0.3.6.6 workflow.
#
# v1.17 A0 (2026-08-07): add wip_v1.17 to trigger branches — the v1.17
# development branch must run the same build+ctest+benchmark gate as main.

name: CI

on:
  push:
    branches: [main, wip_v1.17]
  pull_request:
    branches: [main, wip_v1.17]

jobs:
  build-windows:
    runs-on: windows-2022
    strategy:
      fail-fast: false

    env:
      # v1.16 R4-0 (2026-07-31): see the "Cache vcpkg" comment below. The
      # previous value `${{ env.LOCALAPPDATA }}\vcpkg\archives` expanded to an
      # empty string in the workflow-level `env` context, so vcpkg's binary
      # cache was never preserved between runs.
      VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}\vcpkg_bincache

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # v1.16 R4-0 (2026-07-31) — this cache never produced a usable entry, so
      # every run rebuilt all 33 manifest ports (Qt 6.8.0 debug + release) from
      # source. Two independent defects, both observed in KagamiQA run
      # 82956632293 whose log shows `Cache not found for input keys: vcpkg-...`:
      #   * `path: vcpkg_installed` pointed at the repo root while manifest mode
      #     installs under the CMake binary dir (`build/vcpkg_installed/...`),
      #     so an empty directory was cached.
      #   * the second entry expanded to the literal `\vcpkg\archives`.
      # The configure step below now pins VCPKG_INSTALLED_DIR to the repo root,
      # which both makes this path real and lets CMakeLists.txt:7 skip
      # vcpkg/manifest mode entirely on warm runs.
      # Buildtrees (`vcpkg_installed/vcpkg/blds`, multi-GB) are deliberately
      # excluded; `status`/`info` (~500 KB) are kept as insurance for the case
      # where manifest mode runs anyway.
      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: |
            vcpkg_installed/x64-windows
            vcpkg_installed/vcpkg/status
            vcpkg_installed/vcpkg/info
            vcpkg_bincache
          key: vcpkg-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-

      # R4-1 (2026-08-07): KagamiQA Oracle B / direct runner depend on
      # tests/fixtures/blargg/**/*.nes. These ROMs are NOT in git (the
      # .gitignore `*.nes` exception only covers top-level fixtures, not
      # subdirectories) — they are fetched from the christopherpow/nes-test-roms
      # mirror by scripts/download_blargg_roms.ps1. Without these steps, the
      # `kagami_qa_direct_smoke` ctest gate reports LOAD_ERROR for every
      # blargg_* entry (rc=-2 on `kagami_bridge_load_rom(...)`), dragging CI
      # from 33/33 to 32/33 (run #84395196054). Mirrors the steps already
      # present in .github/workflows/kagami-qa.yml:174-205.
      - name: Cache blargg ROMs
        id: cache-blargg
        uses: actions/cache@v4
        with:
          path: tests/fixtures/blargg
          key: blargg-roms-${{ hashFiles('scripts/download_blargg_roms.ps1') }}
          restore-keys: blargg-roms-

      - name: Fetch blargg test ROMs
        shell: pwsh
        run: ./scripts/download_blargg_roms.ps1

      # Cross-check the manifest: every ROM the manifest promises must
      # actually be on disk before Oracle B / direct runner may claim to
      # have tested it. download_blargg_roms.ps1 reports failures but never
      # sets a non-zero exit code, so a partially-downloaded fixture tree
      # would silently be reported as a full run without this gate.
      - name: Verify blargg ROM fixtures against manifest
        shell: pwsh
        run: |
          $manifest = Get-Content tests/fixtures/blargg_manifest.json -Raw | ConvertFrom-Json
          $missing = @()
          foreach ($rom in $manifest.roms) {
            if (-not (Test-Path (Join-Path 'tests' $rom.path))) { $missing += $rom.path }
          }
          $have = $manifest.roms.Count - $missing.Count
          Write-Host "blargg fixtures: $have / $($manifest.roms.Count) present"
          if ($missing.Count -gt 0) {
            foreach ($p in ($missing | Select-Object -First 10)) { Write-Host "::error::missing ROM: $p" }
            if ($missing.Count -gt 10) { Write-Host "::error::... and $($missing.Count - 10) more" }
            Write-Host "::error::blargg fixture tree is incomplete - Oracle A direct runner and Oracle B blargg suite would fail. Check scripts/download_blargg_roms.ps1 and the upstream mirror."
            exit 1
          }

      # v0.3.7: Load vcvars64.bat via msvc-dev-cmd so cl.exe is on PATH
      # for the cmake configure step. The previous microsoft/setup-msbuild@v2
      # only located MSBuild, not the C/C++ compiler toolchain; on
      # windows-2022 Image 20260607.193.1 this caused the configure step to
      # fail with "CMAKE_CXX_COMPILER: cl ... not found in the PATH".
      - name: Setup MSVC dev cmd
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # v0.3.2: Project requires CMake 4.0+; GitHub-hosted windows-2022 only ships
      # with 3.31.6, so install CMake 4.0 via lukka/get-cmake and prepend it to PATH.
      # v0.3.7: input name fixed to `cmakeVersion` (was `cmake-version`,
      # which the action logs as an unrecognised input warning).
      - name: Setup CMake 4.0
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: '4.0.x'

      # Stage-2 §八 D-3: explicit Rust toolchain install. The build now always
      # links fceux11_rust.lib (with the `direct-adapter` feature on, see
      # src/rust/CMakeLists.txt), so the configure step fatal-errors when
      # FCEUX11_ENABLE_RUST=ON and rustup is missing. Previously this was
      # tolerated only because windows-2022 happened to ship a recent stable
      # toolchain; making it explicit removes the implicit dependency.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      # v1.16 R4-0: defensive — vcpkg creates the binary-cache dir on demand on
      # most versions, but a cold run must not fail on a missing directory.
      - name: Prepare vcpkg binary cache dir
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\vcpkg_bincache" | Out-Null

      - name: Announce cold vcpkg build
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::vcpkg cache miss - this run must build all manifest ports from source (Qt 6.8.0 included). Expect the configure step to take 60+ minutes."

      # v1.16 R4-0: -DVCPKG_INSTALLED_DIR moves the install tree to the repo
      # root so the cache above is real, CMakeLists.txt:7 can skip vcpkg on warm
      # runs, and tests/CMakeLists.txt:431's PATH injection resolves to an
      # existing directory. -DVCPKG_OVERLAY_TRIPLETS activates the release-only
      # cmake/triplets/x64-windows.cmake (see that file's header).
      - name: Configure CMake (Ninja)
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DFCEUX11_BUILD_TESTS=ON
          -DENABLE_LINT_CPPCHECK=OFF
          -DVCPKG_INSTALLED_DIR=${{ github.workspace }}/vcpkg_installed
          -DVCPKG_OVERLAY_TRIPLETS=${{ github.workspace }}/cmake/triplets

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: CTest
        # -LE perf excludes the "perf"-labelled bench_tolerance_test from the
        # gating run. Wall-clock benchmarks are advisory on shared runners
        # (inter-host variance >> tolerance); they are run separately in the
        # "Bench tolerance gate" step below with continue-on-error.
        run: ctest --test-dir build --build-config Release --output-on-failure -LE perf

      # v1.3 Legion Phase 7.2: Golden savestate drift check.
      # If any of the SFORMAT-emitting sources have changed, the golden
      # .fc0 files in tests/fixtures/golden/ may now be stale. We do NOT
      # regenerate on CI (that would mask real regressions by overwriting
      # the committed baseline); instead we surface the diff to the PR
      # author so they can run --generate locally and commit the new
      # .fc0 files alongside the source change.
      - name: Golden savestate drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD | Where-Object {
              $_ -match '^src/state\.cpp$' -or
              $_ -match '^src/x6502\.cpp$' -or
              $_ -match '^src/ppu\.cpp$' -or
              $_ -match '^src/sound\.cpp$' -or
              $_ -match '^src/cpu\.cpp$' -or
              $_ -match '^src/cpu\.h$' -or
              $_ -match '^tests/fixtures/golden/golden_savestate_test\.cpp$'
          }
          if ($changed) {
              Write-Host "::warning::Golden-regenerating files changed:"
              $changed | ForEach-Object { Write-Host "  - $_" }
              Write-Host "::warning::The golden .fc0 files in tests/fixtures/golden/ may now be stale."
              Write-Host "::warning::Please run locally on a Release build and commit the result:"
              Write-Host "::warning::  cd tests"
              Write-Host "::warning::  ../build/tests/fceux11_golden_savestate_test.exe --generate"
              Write-Host "::warning::Then push the updated .fc0 files and golden_index.json."
          } else {
              Write-Host "No SFORMAT-emitting sources changed; golden is in sync."
          }

      # v1.3 Legion Phase 7.2 (optional): --compare-layout diagnostic.
      # Runs the layout comparison as an advisory step. The exit code
      # is captured but the workflow does not fail on layout drift here
      # (that's what the dedicated golden_savestate_test ctest is for);
      # the value of this step is the per-chunk diff output that pinpoints
      # the source of any drift.
      - name: Golden layout compare (advisory)
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/tests
        shell: pwsh
        run: |
          $exe = "../build/tests/fceux11_golden_savestate_test.exe"
          if (Test-Path $exe) {
              & $exe --compare-layout | Out-File -FilePath golden_compare_layout.log
              Write-Host "Layout compare output saved to golden_compare_layout.log"
              Get-Content golden_compare_layout.log | Select-Object -Last 20
          } else {
              Write-Host "::warning::$exe not built; skipping layout compare."
          }

      # v1.4 Gateway Phase 7.4: Bus dispatch site drift check.
      # If any of the bus-surface sources have changed, mapper_core_test
      # regression coverage is the canary. We surface the changed files
      # to the PR author so they remember to verify mapper_core_test.
      - name: Bus dispatch site drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}
        shell: pwsh
        run: |
          $changed = git diff --name-only origin/${{ github.base_ref }}...HEAD | Where-Object {
              $_ -match '^src/boards/.*\.cpp$' -or
              $_ -match '^src/bus\.(cpp|h)$' -or
              $_ -match '^src/cart\.(cpp|h)$'
          }
          if ($changed) {
              Write-Host "::warning::Bus-relevant files changed; verify mapper_core_test stays green."
              Write-Host "::warning::Changed files:"
              $changed | ForEach-Object { Write-Host "  - $_" }
              Write-Host "::warning::Run locally:"
              Write-Host "::warning::  ctest --test-dir build -C Release -R mapper_core_test"
          } else {
              Write-Host "No bus-surface sources changed; coverage still applies."
          }

      # v1.4 Gateway Phase 7.4: hot-path reference-alias drift check.
      # Phase 3 committed to keeping ARead[] / BWrite[] / VPage[] /
      # MMC5SPRVPage[] / MMC5BGVVPage[] direct indexing out of the hot-
      # path files. The ppu.cpp VPage[] / MMC5SPRVPage[] retention and
      # the fceu.cpp handler-registration retention are documented
      # exceptions (§5.1.5 and §5.3.3 of v1.4_Gateway_Build_Plan.md).
      # Any new direct indexing outside these exceptions is a
      # regression of the Phase 3 hot-path migration and should fail
      # the build.
      - name: Hot-path reference-alias drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/src
        shell: pwsh
        run: |
          $hits = git grep -n "ARead\[\|BWrite\[\|VPage\[\|MMC5SPRVPage\[\|MMC5BGVPage\[" -- x6502.cpp ppu.cpp cart.cpp cheat.cpp debug.cpp nsf.cpp lua-engine.cpp 2>$null
          if ($hits) {
              # Documented exceptions (per plan §5.3.4 + §5.1.5):
              # - fceu.cpp (cold-path handler registration)
              # - ppu.cpp VPage[] / MMC5SPRVPage[] (Phase 3 §5.1.5 retention:
              #   MSVC did not inline g_bus.vpage() to the same RIP-relative
              #   machine code as the reference-alias; +6-8% bench regression
              #   caused migration to be rolled back)
              # - ppu.cpp ARead[x]/BWrite[x] lines 1756-1773: PPU register
              #   init (cold path, runs once on Power())
              $hotHits = $hits | Where-Object {
                  $_ -notmatch 'fceu\.cpp' -and
                  -not ($_ -match 'ppu\.cpp' -and $_ -match 'VPage\[|MMC5SPRVPage\[') -and
                  -not ($_ -match 'ppu\.cpp:17[5-7]\d:' -and $_ -match 'ARead\[|BWrite\[')
              }
              if ($hotHits) {
                  Write-Host "::error::Direct reference-alias indexing in hot-path files (must use g_bus.):"
                  $hotHits | ForEach-Object { Write-Host "  $_" }
                  exit 1
              } else {
                  Write-Host "Only documented exceptions present (fceu.cpp cold path + ppu.cpp VPage/MMC5SPRVPage hot-path retention + ppu.cpp PPU-register-init handler registration)."
              }
          } else {
              Write-Host "No direct ARead[]/BWrite[]/VPage[]/MMC5SPRVPage[]/MMC5BGVPage[] indexing in hot-path files. ✓"
          }

      # v1.4 Gateway Phase 7.4: board-file direct-array drift check.
      # All 175 board files should route through Bus (inline forwarders
      # or g_bus. direct access). Direct ARead[] / BWrite[] / Page[] /
      # VPage[] / VPageG[] / PRGptr[] / CHRptr[] / MMC5SPRVPage[] /
      # MMC5BGVPage[] / VPageR[] indexing in board files is a
      # regression of the Phase 4 / Phase 5 board migration batches.
      - name: Board-file direct-array drift check
        if: github.event_name == 'pull_request'
        working-directory: ${{ github.workspace }}/src
        shell: pwsh
        run: |
          $hits = git grep -n "ARead\[\|BWrite\[\|Page\[\|VPage\[\|VPageG\[\|PRGptr\[\|CHRptr\[\|MMC5SPRVPage\[\|MMC5BGVPage\[\|VPageR\[" -- boards/ 2>$null
          if ($hits) {
              # Documented exceptions:
              # - boards/datalatch.cpp VPageR (rule 3 preserved uint8_t** alias)
              # - boards/fns.cpp commented-out PRGptr/CHRptr (lines 207/210 are //)
              # - boards/n106.cpp NTAPage (local static array, not global)
              $boardHits = $hits | Where-Object {
                  $_ -notmatch 'boards/datalatch\.cpp' -and
                  $_ -notmatch 'boards/fns\.cpp:20[78]:' -and
                  $_ -notmatch 'boards/fns\.cpp:21[08]:' -and
                  $_ -notmatch 'boards/n106\.cpp.*NTAPage\['
              }
              if ($boardHits) {
                  Write-Host "::error::Direct array indexing in board files (must use g_bus.):"
                  $boardHits | ForEach-Object { Write-Host "  $_" }
                  exit 1
              } else {
                  Write-Host "Only documented exceptions present (datalatch VPageR / fns comments / n106 NTAPage)."
              }
          } else {
              Write-Host "No direct array indexing in board files. ✓"
          }

      # R4-1 (2026-08-07): these steps invoke the built test .exe directly
      # (not via ctest), so they do NOT inherit the vcpkg runtime PATH that
      # tests/CMakeLists.txt injects via ENVIRONMENT_MODIFICATION
      # (_FCEUX11_TEST_PATH_MODIFICATIONS). fceux11_*_test.exe link against
      # vcpkg DLLs (Qt6Core.dll, SDL2.dll, z.dll, ...); without the vcpkg bin
      # dir on PATH the exe fails at startup with STATUS_DLL_NOT_FOUND
      # (0xC0000135), which failed CI run #84395196054's `ROM Regression Test`
      # step (ctest 33/33 passed because ctest injects the PATH; the manual
      # step did not). Prepend the vcpkg install tree -- which configure pins
      # to ${{ github.workspace }}/vcpkg_installed via -DVCPKG_INSTALLED_DIR.
      - name: ROM Regression Test
        working-directory: ${{ github.workspace }}/tests
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          $regTest = "../build/tests/fceux11_rom_regression_test.exe"
          if (-not (Test-Path "fixtures/golden_hashes.json")) {
            & $regTest --generate
          }
          & $regTest
        shell: pwsh

      - name: Benchmark (smoke)
        working-directory: ${{ github.workspace }}/tests
        run: |
          $env:PATH = "${{ github.workspace }}/vcpkg_installed/x64-windows/bin;${{ github.workspace }}/vcpkg_installed/x64-windows/debug/bin;$env:PATH"
          $benchDir = "../build/tests"
          & "$benchDir/fceux11_bench_ppu_render.exe"
          & "$benchDir/fceux11_bench_x6502_exec.exe"
          & "$benchDir/fceux11_bench_apu_mix.exe"
        shell: pwsh

      # v1.3 Legion Phase 7.3: performance baseline gate.
      # Uses the committed v1.3 baseline (tests/fixtures/bench_baseline.json)
      # which is regenerated by maintainers on a dedicated runner. The
      # 2.5% tolerance is the practical floor; tighten to 1% only after
      # moving to a dedicated runner with no other workloads.
      - name: Bench tolerance gate
        # Advisory only: GitHub Actions runner hardware variance routinely
        # exceeds the 2.5% tolerance, so a failure here is not actionable as
        # a code regression. The step still runs and surfaces the numbers
        # (and FAIL line) in the log for visibility.
        continue-on-error: true
        working-directory: ${{ github.workspace }}/tests
        run: |
          if (Test-Path "../build/tests/fceux11_bench_tolerance_test.exe") {
            $env:FCEUX11_BENCH_BASELINE = "fixtures/bench_baseline.json"
            & "../build/tests/fceux11_bench_tolerance_test.exe"
          } else {
            Write-Host "::warning::fceux11_bench_tolerance_test.exe not built; skipping."
          }
        shell: pwsh
